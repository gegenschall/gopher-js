name: Memory soak

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 6'

permissions:
  contents: read

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @gopher-js/interop-tests soak --memory
