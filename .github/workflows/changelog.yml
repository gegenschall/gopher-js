name: Changelog

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-main

jobs:
  version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: pnpm install --frozen-lockfile

      - uses: changesets/action/select-mode@v2
        id: changesets

      - uses: changesets/action/version@v2
        if: steps.changesets.outputs.mode == 'version'
        with:
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ github.token }}
