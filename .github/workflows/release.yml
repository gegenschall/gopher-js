name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.changesets.outputs.mode }}
      plan: ${{ steps.changesets.outputs.publish-plan-artifact-id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
      - run: pnpm install --frozen-lockfile
      - id: version
        run: echo "version=$(jq -r .version packages/core/package.json)" >> "$GITHUB_OUTPUT"
      - uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        id: changesets

  version:
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          commit-message: 'chore(release): version packages'
          pr-title: 'chore(release): version packages'
          # The API path failed to replace refs/heads/changeset-release/main.
          push-with-git-cli: true

  pack:
    needs: select
    if: needs.select.outputs.mode == 'publish' && needs.select.outputs.version != '0.0.0'
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run typecheck build test
      - uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        id: pack
        with:
          publish-plan-artifact-id: ${{ needs.select.outputs.plan }}

  publish:
    needs: pack
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.artifact }}
          create-github-releases: true
